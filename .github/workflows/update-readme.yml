name: Update README Index

on:
  push:
    paths:
      - '**.geojson'
      - '**.json'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rebuild README Table
        run: |
          shopt -s nullglob
          README="README.md"
          REPO="${{ github.repository }}"
          
          echo "# File Index" > $README
          echo "| Filename | Raw Link |" >> $README
          echo "| --- | --- |" >> $README
          
          # Find files and handle spaces in the loop
          find . -maxdepth 1 -type f \( -iname "*.geojson" -o -iname "*.json" \) | while read -r file; do
            FILENAME=$(basename "$file")
            
            if [ "$FILENAME" != "$README" ]; then
              # Replace spaces with %20 for the URL
              ENCODED_FILENAME=$(echo "$FILENAME" | sed 's/ /%20/g')
              
              RAW_URL="https://raw.githubusercontent.com/$REPO/refs/heads/main/$ENCODED_FILENAME"
              
              # Add to table: [Original Name] | [Encoded URL]
              echo "| $FILENAME | $RAW_URL |" >> "$README"
            fi
          done

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "docs: fix URL encoding for spaces"
            git push
          fi
