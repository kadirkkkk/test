name: Update README Index

on:
  push:
    paths:
      - '**.geojson'
      - '**.json'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rebuild README Table
        run: |
          # 1. Debug: Show all files in the runner so you can check paths in the log
          echo "Listing all files in the current directory:"
          ls -R
          
          # 2. Setup
          README="README.md"
          REPO="${{ github.repository }}"
          
          echo "# File Index" > $README
          echo "| Filename | Raw Link |" >> $README
          echo "| --- | --- |" >> $README
          
          # 3. Find files (Case-insensitive search for .json and .geojson)
          # This finds files in the root and subfolders
          find . -maxdepth 1 -type f \( -iname "*.geojson" -o -iname "*.json" \) | while read -r file; do
            FILENAME=$(basename "$file")
            
            # Skip the README itself
            if [ "$FILENAME" != "$README" ]; then
              RAW_URL="https://raw.githubusercontent.com/$REPO/refs/heads/main/$FILENAME"
              echo "| $FILENAME | $RAW_URL |" >> "$README"
            fi
          done

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to README.md."
          else
            git commit -m "docs: sync file index in README"
            git push
          fi
